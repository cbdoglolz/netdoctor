name: Validate prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: mkdir -p server/web && cp -r dist/* server/web/
      - run: go test ./...
        working-directory: server
